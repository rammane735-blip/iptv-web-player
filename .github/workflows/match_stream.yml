name: 🔴 Start Match Cloud Stream

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'رابط القناة من سيرفر الـ IPTV'
        required: true
        default: 'http://mbx4k.store:80/miritest/a020a350d0/286335.ts'
      livepeer_key:
        description: 'مفتاح البث Stream Key من حسابك في Livepeer Studio'
        required: true
        default: '73a8-7mnk-01qq-p6uw'
      max_hours:
        description: 'مدة البث بالساعات (افتراضي: 3 ساعات للمباراة والشوطين)'
        required: true
        default: '3'

jobs:
  cloud_stream:
    name: ⚽ Cloud Restream to Livepeer
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: ⚙️ Setup FFmpeg and Network Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg curl

      - name: 🚀 Start Cloud Stream to Livepeer (No PC / No OBS Needed)
        run: |
          echo "=========================================================="
          echo "⚽ Starting Cloud Restream from IPTV to Livepeer..."
          echo "IPTV URL: ${{ github.event.inputs.stream_url }}"
          echo "Duration Limit: ${{ github.event.inputs.max_hours }} Hours"
          echo "Livepeer Key: ${{ github.event.inputs.livepeer_key }}"
          echo "=========================================================="

          HOURS="${{ github.event.inputs.max_hours }}"
          SECONDS_LIMIT=$(python3 -c "print(int(float('$HOURS') * 3600))")
          END_TIME=$(( $(date +%s) + SECONDS_LIMIT ))

          echo "Stream will run until $(date -d @$END_TIME) ($HOURS hours)."

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "--------------------------------------------------------"
            echo "🚀 Connecting IPTV stream to Livepeer RTMP..."
            echo "--------------------------------------------------------"

            # Direct input with high probesize and auto-reconnect
            ffmpeg -hide_banner \
              -reconnect 1 \
              -reconnect_at_eof 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 5 \
              -user_agent "VLC/3.0.18 LibVLC/3.0.18" \
              -analyzeduration 15M -probesize 15M \
              -i "${{ github.event.inputs.stream_url }}" \
              -c:v copy \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv "rtmp://rtmp.livepeer.com/live/${{ github.event.inputs.livepeer_key }}" || {
                echo "Direct mode ended, trying buffered pipeline mode..."
                curl -s -L -A "VLC/3.0.18 LibVLC/3.0.18" "${{ github.event.inputs.stream_url }}" | \
                  ffmpeg -hide_banner \
                    -analyzeduration 20M -probesize 20M \
                    -f mpegts -i pipe:0 \
                    -c:v copy \
                    -c:a aac -b:a 128k -ar 44100 \
                    -f flv "rtmp://rtmp.livepeer.com/live/${{ github.event.inputs.livepeer_key }}" || true
            }

            echo "Stream disconnected. Reconnecting in 3 seconds..."
            sleep 3
          done

          echo "=========================================================="
          echo "✅ Match Stream session finished successfully."
          echo "=========================================================="
